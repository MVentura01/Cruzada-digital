<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cruzada Digital - Arquitetura Computacional</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header class="site-header">
        <h1>CRUZADA DIGITAL</h1>
        <p>Arquitetura Computacional</p>
    </header>

    <main class="container">

        <section class="board-section">
            <h2>Complete a cruzadinha</h2>

            <div class="board-container">
                <div id="board" class="board" aria-label="Tabuleiro da cruzadinha"></div>
            </div>

            <div class="controls">
                <button id="check-btn">CONFERIR</button>
                <button id="reset-btn">REINICIAR</button>
            </div>

            <p id="score">0 de 12 palavras</p>
            <p id="message" aria-live="polite"></p>
        </section>

        <aside class="clues-section">

            <div class="clue-group">
                <h2>HORIZONTAIS</h2>
                <ol id="across-clues"></ol>
            </div>

            <div class="clue-group">
                <h2>VERTICAIS</h2>
                <ol id="down-clues"></ol>
            </div>

        </aside>

    </main>

</body>
</html>
